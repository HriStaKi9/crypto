services:
  db:
    image: timescale/timescaledb-ha:pg16
    container_name: mse_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mse}
      POSTGRES_DB: ${POSTGRES_DB:-market_signal_engine}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/home/postgres/pgdata/data
      # Прилагат се само при първо стартиране на празен volume.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seeds.sql:/docker-entrypoint-initdb.d/02_seeds.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mse} -d ${POSTGRES_DB:-market_signal_engine}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: mse_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
