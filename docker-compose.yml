services:
  db:
    image: timescale/timescaledb-ha:pg16
    container_name: mse_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mse}
      POSTGRES_DB: ${POSTGRES_DB:-market_signal_engine}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/home/postgres/pgdata/data
      # Прилагат се само при първо стартиране на празен volume.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seeds.sql:/docker-entrypoint-initdb.d/02_seeds.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mse} -d ${POSTGRES_DB:-market_signal_engine}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: mse_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

  # Личен monitoring dashboard (api/main.py) — http://localhost:8000.
  # Read-only observability върху ingestion таблиците, НЕ Stage 4
  # сигнал engine API-то от CLAUDE.md.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mse_api
    restart: unless-stopped
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      # Вътре в docker мрежата хостът е service name-а 'db', не localhost
      # от .env (който е за връзка от host машината, напр. през Adminer).
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mse}:${POSTGRES_PASSWORD:-mse}@db:5432/${POSTGRES_DB:-market_signal_engine}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  # Непрекъснатият ingestion поток от CLAUDE.md Етап 1 (GDELT/RSS/
  # CryptoPanic/Binance/yfinance на техния реален update ритъм).
  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mse_ingestion
    restart: unless-stopped
    command: python -m ingestion.scheduler
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mse}:${POSTGRES_PASSWORD:-mse}@db:5432/${POSTGRES_DB:-market_signal_engine}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
